name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (migraciones, prueba de humo, auditoría)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: file:./prisma/ci.db
      JWT_SECRET: ci-secret-solo-para-pruebas-0123456789abcdef
      PASSWORD_LOGIN: 'true'
      FRONTEND_URL: http://localhost:5173
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: node prisma/seed.js
      - name: Arrancar la API
        run: |
          node index.js > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/salud && break || sleep 1; done
      - name: Prueba de humo
        run: node scripts/smoke.js
      - name: Registro de la API (si falla)
        if: failure()
        run: cat ../api.log
      - name: Auditoría de dependencias (producción)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (compilación y auditoría)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://api.ejemplo.test
      - run: npm audit --omit=dev --audit-level=high
